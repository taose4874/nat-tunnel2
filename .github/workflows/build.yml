name: Build NATUN (Windows Only)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

jobs:
  build:
    name: Build for Windows
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: Build client (Windows)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          cd udpclient
          go build -v -o natun-windows-amd64.exe

      - name: Build server (Windows)
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          cd udpcloud
          go build -v -o server-windows-amd64.exe

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            udpclient/natun-windows-amd64.exe
            udpcloud/server-windows-amd64.exe
          retention-days: 30

  release:
    name: Create Release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: artifacts/

      - name: List artifacts
        run: ls -la artifacts/

      - name: Zip artifacts
        run: |
          cd artifacts
          zip -r ../natun-windows.zip .

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v1
        with:
          files: natun-windows.zip
