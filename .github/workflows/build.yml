name: 构建 NATUN（仅 Windows）

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [created]

jobs:
  build:
    name: 构建 Windows 版本
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 配置 Go 环境
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache: true

      - name: 构建客户端（Windows）
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          cd udpclient
          go build -v -o natun-windows-amd64.exe

      - name: 构建服务器（Windows）
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          cd udpcloud
          go build -v -o server-windows-amd64.exe

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: build-windows
          path: |
            udpclient/natun-windows-amd64.exe
            udpcloud/server-windows-amd64.exe
          retention-days: 30

  release:
    name: 创建发布
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build-windows
          path: artifacts/

      - name: 列出构建产物
        run: ls -la artifacts/

      - name: 打包压缩
        run: |
          cd artifacts
          zip -r ../natun-windows.zip .

      - name: 上传发布文件
        uses: softprops/action-gh-release@v1
        with:
          files: natun-windows.zip
